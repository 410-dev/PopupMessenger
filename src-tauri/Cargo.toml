[package]
name = "popup-messenger"
version = "0.1.3"
description = "LAN popup messenger"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "fs", "time", "sync", "rt", "macros"] }
fs2 = "0.4"
if-addrs = "0.13"
gethostname = "0.5"
zip = { version = "8", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Same versions as wry uses, for the WebView2 drop workaround (src/windrop.rs).
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
