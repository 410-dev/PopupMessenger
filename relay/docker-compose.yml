services:
  relay:
    build: .
    image: popup-relay:latest
    restart: unless-stopped
    ports:
      # Client protocol (TLS 1.3 and, if the policy allows, plain TCP on the same port).
      - "${RELAY_PORT:-45443}:45443"
      # Admin web UI: published on the host's loopback only. The first person to
      # open it creates the admin account, so do not expose it before that.
      # For remote access put an HTTPS reverse proxy in front or use an SSH tunnel.
      # Override the host ports with RELAY_PORT / ADMIN_PORT (e.g. in a .env file).
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
    volumes:
      - relay-data:/data
      # Your own certificate instead of the generated self-signed one:
      # - ./certs:/certs:ro
    environment:
      # Names in the generated self-signed certificate (comma separated).
      TLS_NAMES: "localhost"
      # TLS_CERT: /certs/fullchain.pem
      # TLS_KEY: /certs/privkey.pem

volumes:
  relay-data:
