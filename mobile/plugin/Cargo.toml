[package]
name = "tauri-plugin-pm-native"
version = "0.1.0"
description = "Native helpers for PopupMessenger mobile: open, share and save received files, haptics"
edition = "2021"
links = "tauri-plugin-pm-native"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
